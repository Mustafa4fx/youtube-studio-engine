<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Inter:wght@500;700;800&family=Cairo:wght@600;800&family=Reem+Kufi:wght@700&family=Alexandria:wght@600;800;900&family=Almarai:wght@700;800&family=Lalezar&family=Readex+Pro:wght@600;700&family=Rubik:wght@700;800;900&display=swap" rel="stylesheet">
<style>
  :root { --bg:#07060D; --accent:#D4FF3A; --accent2:#6E2EFF; --text:#FFFFFF; --muted:#A7A9BE; --danger:#FF3B5C;
          --fh:'Unbounded','Inter',sans-serif; --fb:'Inter',sans-serif; }
  html,body { margin:0; padding:0; background:var(--bg); }
  #stage { width:1920px; height:1080px; position:relative; overflow:hidden; background:var(--bg); color:var(--text); font-family:var(--fb); }
  #stage.v { width:1080px; height:1920px; }
  .bg-dots { position:absolute; inset:0; background-image: radial-gradient(rgba(255,255,255,.08) 2px, transparent 2px); background-size:48px 48px; }
  .bg-glow { position:absolute; width:1800px; height:1800px; left:50%; top:50%; margin:-900px 0 0 -900px;
             background: radial-gradient(circle, rgba(110,46,255,.55) 0%, rgba(110,46,255,.15) 32%, rgba(110,46,255,0) 60%); }
  .bug { position:absolute; top:44px; right:56px; font-family:var(--fh); font-weight:800; font-size:30px; letter-spacing:1px;
         padding:8px 18px; border-radius:12px; background:var(--accent); color:#07060D; }
  [dir=rtl] .bug { right:auto; left:56px; }
  .layer { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; }
  .col { display:flex; flex-direction:column; align-items:center; gap:28px; text-align:center; max-width:1500px; }
  .kicker { font-family:var(--fh); font-weight:800; font-size:40px; color:var(--accent); letter-spacing:3px; text-transform:uppercase; }
  .title { font-family:var(--fh); font-weight:800; font-size:140px; line-height:1.05; letter-spacing:-2px; }
  .sub { font-size:46px; font-weight:700; color:var(--muted); line-height:1.35; }
  .statement { font-family:var(--fh); font-weight:800; font-size:128px; line-height:1.15; max-width:1600px; text-align:center; }
  .hl { color:var(--accent); }
  .caption { position:absolute; left:50%; bottom:70px; transform:translateX(-50%); font-family:var(--fh); font-weight:800; font-size:52px;
             padding:14px 34px; background:#07060D; border:4px solid var(--accent); border-radius:999px; white-space:nowrap; }
  #stage.v .caption { bottom:260px; font-size:58px; white-space:normal; max-width:900px; text-align:center; }
  /* chat */
  .chat { width:1400px; background:#14121F; border:3px solid rgba(255,255,255,.12); border-radius:36px; padding:44px; box-shadow:0 40px 120px rgba(0,0,0,.6); }
  #stage.v .chat { width:940px; }
  .q { align-self:flex-end; margin-left:auto; max-width:85%; background:var(--accent2); font-size:48px; font-weight:700; padding:22px 32px; border-radius:30px 30px 6px 30px; width:fit-content; }
  [dir=rtl] .q { margin-left:0; margin-right:auto; border-radius:30px 30px 30px 6px; }
  .ans { margin-top:34px; display:flex; flex-direction:column; gap:18px; }
  .row { display:flex; align-items:center; gap:22px; font-size:46px; font-weight:700; background:rgba(255,255,255,.06); border-radius:18px; padding:18px 26px; }
  .num { width:56px; height:56px; border-radius:50%; background:var(--accent); color:#07060D; display:flex; align-items:center; justify-content:center; font-family:var(--fh); font-size:30px; flex-shrink:0; }
  .blur { filter: blur(12px); }
  .row.empty { background:transparent; border:4px dashed rgba(255,255,255,.35); color:var(--muted); }
  .ring { position:absolute; border:10px solid var(--danger); border-radius:40px; box-shadow:0 0 40px var(--danger); }
  .typing::after { content:''; }
  /* bignum */
  .bignum { font-family:var(--fh); font-weight:800; font-size:260px; line-height:1; letter-spacing:-6px; color:var(--accent); text-shadow:0 0 60px rgba(212,255,58,.45); }
  #stage.v .bignum { font-size:190px; }
  .beam { position:absolute; left:-20%; width:140%; height:12px; top:50%; background:#fff; box-shadow:0 0 24px var(--accent),0 0 80px var(--accent),0 0 160px var(--accent); }
  /* dots */
  .dotgrid { display:grid; gap:12px; }
  .d { width:16px; height:16px; border-radius:50%; background:rgba(255,255,255,.16); }
  .d.on { background:var(--accent); box-shadow:0 0 20px var(--accent); }

  .cards { display:flex; gap:44px; align-items:stretch; }
  #stage.v .cards { flex-direction:column; }
  .card { width:640px; background:#14121F; border:4px solid rgba(255,255,255,.12); border-radius:34px; padding:46px; text-align:start; position:relative; }

  .card p { margin:10px 0; font-size:38px; font-weight:700; line-height:1.35; color:#E8E8F2; }
  .stamp { position:absolute; bottom:-26px; right:30px; background:var(--danger); color:#fff; font-family:var(--fh); font-size:28px; padding:10px 20px; border-radius:12px; transform:rotate(-4deg); }
  [dir=rtl] .stamp { right:auto; left:30px; transform:rotate(4deg); }
  /* steps */
  .steps { display:flex; flex-direction:column; gap:30px; width:1500px; }
  #stage.v .steps { width:960px; }
  .step { display:flex; align-items:center; gap:34px; background:#14121F; border-radius:28px; padding:30px 40px; border:4px solid rgba(255,255,255,.1); }
  .step .n { font-family:var(--fh); font-weight:800; font-size:72px; color:var(--accent); width:110px; flex-shrink:0; text-align:center; }
  .step .t { font-size:50px; font-weight:800; line-height:1.25; text-align:start; }

  .glitch { font-family:var(--fh); font-weight:800; font-size:260px; color:var(--danger); position:relative; }

  .glitch .g1 { color:#00F0FF; mix-blend-mode:screen; }
  .glitch .g2 { color:var(--accent); mix-blend-mode:screen; }

  .src-wrap { position:relative; width:1700px; height:820px; }
  .src-ans { position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:620px; }
  .src { position:absolute; width:330px; padding:26px; border-radius:24px; background:#14121F; border:4px solid var(--accent); font-size:38px; font-weight:800; text-align:center; }
  .wire { position:absolute; height:6px; background:var(--accent); box-shadow:0 0 20px var(--accent); transform-origin:0 50%; }
  /* outro */
  .logo { font-family:var(--fh); font-weight:800; font-size:170px; letter-spacing:-4px; position:relative; }
  .sub-btn { font-family:var(--fh); font-weight:800; font-size:48px; background:var(--danger); color:#fff; padding:22px 50px; border-radius:18px; }
  .timer { width:150px; height:150px; border-radius:50%; border:12px solid rgba(255,255,255,.15); border-top-color:var(--accent); }

  /* ===== kinetic layer ===== */
  .cam { position:absolute; inset:0; }
  .fit { position:absolute; inset:0; }
  .fit.withcap { transform: translateY(-95px) scale(.84); }
  #stage.v .fit.withcap { transform: translateY(-180px) scale(.92); }
  .blob { position:absolute; width:1100px; height:1100px; border-radius:50%; margin:-550px 0 0 -550px; }
  .blob.b1 { background: radial-gradient(circle, rgba(110,46,255,.55), rgba(110,46,255,0) 62%); }
  .blob.b2 { background: radial-gradient(circle, rgba(212,255,58,.16), rgba(212,255,58,0) 60%); }
  .blob.b3 { background: radial-gradient(circle, rgba(255,59,92,.18), rgba(255,59,92,0) 60%); }
  .pt { position:absolute; width:8px; height:8px; border-radius:2px; background:var(--accent); opacity:.5; }
  .pt.c2 { background:#fff; opacity:.35; width:5px; height:5px; }
  .flash { position:absolute; inset:0; background:var(--accent); opacity:0; mix-blend-mode:overlay; pointer-events:none; }
  .flash.w { background:#fff; mix-blend-mode:normal; }
  .kcap { position:absolute; left:0; right:0; bottom:58px; display:flex; justify-content:center; pointer-events:none; }
  #stage.v .kcap { bottom:330px; }
  .chunk { position:absolute; bottom:0; display:flex; flex-wrap:wrap; justify-content:center; gap:6px 16px; max-width:1640px; padding:0 40px;
           font-family:var(--fh); font-weight:800; font-size:66px; line-height:1.15; text-transform:none; }
  #stage.v .chunk { max-width:980px; font-size:76px; }
  [dir=rtl] .chunk { font-size:74px; }
  .kw { display:inline-block; padding:4px 14px; border-radius:14px; color:#fff;

  .kw.em { color:var(--accent); }
  .pop { position:absolute; width:150px; height:150px; border-radius:36px; display:flex; align-items:center; justify-content:center;
         background:#14121F; border:5px solid var(--accent); box-shadow:0 0 40px rgba(212,255,58,.35), 0 20px 60px rgba(0,0,0,.6); }
  .pop svg { width:84px; height:84px; stroke:var(--accent); fill:none; stroke-width:2.2; stroke-linecap:round; stroke-linejoin:round; }
  .pop.red { border-color:var(--danger); box-shadow:0 0 40px rgba(255,59,92,.45); } .pop.red svg { stroke:var(--danger); }
  .pop.vio { border-color:var(--accent2); box-shadow:0 0 40px rgba(110,46,255,.6); } .pop.vio svg { stroke:#B99BFF; }
  .burst { position:absolute; width:20px; height:20px; margin:-10px 0 0 -10px; border-radius:50%; border:6px solid var(--accent); }
  .swk { position:absolute; height:10px; background:var(--accent); border-radius:6px; }
  .sw { display:inline-block; }

  .wipe { position:absolute; top:-20%; height:140%; width:70%; background:linear-gradient(90deg, var(--accent2), var(--accent2) 80%, var(--accent)); transform:skewX(-18deg); }
  .streak { position:absolute; top:0; bottom:0; width:260px; background:linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,.5), rgba(255,255,255,0)); transform:skewX(-20deg); mix-blend-mode:overlay; }
  .cf { position:absolute; width:18px; height:18px; border-radius:3px; }
  .shape { position:absolute; opacity:.5; }
  .shape svg { width:100%; height:100%; fill:none; stroke-width:3; }

  .emo { position:absolute; font-size:150px; line-height:1; font-family:'Noto Color Emoji','Apple Color Emoji',sans-serif; filter:drop-shadow(0 14px 24px rgba(0,0,0,.6)); }

  .browser { width:1500px; height:800px; background:#fff; border-radius:22px; overflow:hidden; box-shadow:0 50px 140px rgba(0,0,0,.75), 0 0 0 4px rgba(212,255,58,.6); position:relative; }
  #stage.v .browser { width:980px; height:1100px; }
  .bbar { height:64px; background:#1E1C2B; display:flex; align-items:center; gap:12px; padding:0 22px; }
  .bdot { width:16px; height:16px; border-radius:50%; } .bdot.r{background:#FF5F57}.bdot.y{background:#FEBC2E}.bdot.g{background:#28C840}
  .burl { flex:1; margin-left:20px; height:40px; border-radius:20px; background:#2D2A3E; color:#E7E7F2; font:600 24px Inter,sans-serif; display:flex; align-items:center; padding:0 22px; direction:ltr; }
  .bview { position:absolute; top:64px; left:0; right:0; bottom:0; overflow:hidden; background:#fff; }
  .bview .pg { position:absolute; left:0; top:0; transform-origin:0 0; }
  .mark { position:absolute; background:rgba(212,255,58,.55); mix-blend-mode:multiply; border-radius:6px; transform-origin:0 50%; }
  .markbox { position:absolute; border:6px solid var(--danger); border-radius:14px; box-shadow:0 0 30px var(--danger); }
  .news { position:relative; width:1500px; height:820px; }
  #stage.v .news { width:980px; height:1200px; }
  .ncard { position:absolute; left:50%; width:1150px; margin-left:-575px; background:#FAFAF7; color:#111; border-radius:22px; padding:36px 44px; box-shadow:0 40px 100px rgba(0,0,0,.7); direction:ltr; text-align:left; }
  #stage.v .ncard { width:900px; margin-left:-450px; }
  .ncard .src { position:static; display:inline-block; width:auto; border:0; background:#111; color:var(--accent); font:800 24px Unbounded,Inter,sans-serif; letter-spacing:1px; padding:8px 16px; border-radius:8px; text-transform:uppercase; }
  .ncard .hd { font:800 46px/1.12 Inter,sans-serif; margin:20px 0 12px; letter-spacing:-1px; }
  .ncard .dt { font:600 26px Inter,sans-serif; color:#666; }
  [dir=rtl] #stage, [dir=rtl] #stage * { letter-spacing:0 !important; }
</style>
